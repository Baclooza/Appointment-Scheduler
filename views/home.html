<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointment Scheduler</title>
</head>
<body>
    <form id="appointment-form" href="#" method="post">
        <label for="fname">First Name</label>
        <input type="text" id="fname" name="fname">
        <span class="err" id="err-fname">First name is required</span>

        <label for="lname">Last Name</label>
        <input type="text" id="lname" name="lname">
        <span class="err" id="err-lname">Last name is required</span>

        <label for="date">Date</label>
        <input type="date" id="date" name="date">
        <!-- <span class="err" id="err-date">Date is required</span> -->

        <label for="time">Time</label>
        <input type="time" id="time" name="time">
        <!-- <span class="err" id="err-time">Time is required</span> -->

        <button type="submit">Submit</button>
    </form>

    
</body>
</html>
