<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/styles/style.css" />
    <script src="/scripts/appointment.js" defer></script>
    <title>Appointment Scheduler</title>
  </head>
  <body>
    <div class="main">
      <div class="heading">
        <h1>Appointment Scheduler</h1>
      </div>

      <div class="body">
        <h2>Book An Appointment</h2>
        <form id="appointment-form" action="/submit-appointment" method="post">
          <div class="row">
            <label for="fname">First Name</label>
            <input type="text" id="fname" name="fname" placeholder="Jane" />
            <span class="err" id="err-fname">First name is required</span>
          </div>

          <div class="row">
            <label for="lname">Last Name</label>
            <input type="text" id="lname" name="lname" placeholder="Doe" />
            <span class="err" id="err-lname">Last name is required</span>
          </div>

          <div class="row">
            <label for="date">Meeting Date</label>
            <input type="date" id="date" name="date" placeholder="mm/dd/yyyy" />
          </div>

          <div class="row">
            <label for="time">Meeting Time</label>
            <input type="time" id="time" name="time" />
          </div>

          <button type="submit" id="book-appointment-button">
            Book Appointment
          </button>
        </form>
      </div>
    </div>
  </body>
</html>
